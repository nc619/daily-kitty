# Backup wake-up: the server keeps itself awake, but if it ever sleeps this wakes it for each morning.
# GitHub often runs these hours late. The server only sends one per person per day, so extra runs are harmless.
name: Daily kitty

on:
  schedule:
    - cron: "5 6 * * *" # 09:05 Moscow
    - cron: "5 8 * * *" # 09:05 London in summer
    - cron: "5 9 * * *" # 09:05 London in winter
    - cron: "30 10 * * *" # backup
  workflow_dispatch:

permissions:
  actions: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver today's kitty
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 120 -X POST "https://daily-kitty.onrender.com/api/daily"; then exit 0; fi
            sleep 30
          done
          exit 1
      # GitHub pauses scheduled workflows after 60 days without commits; this keeps it on.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-kitty.yml/enable" || true
